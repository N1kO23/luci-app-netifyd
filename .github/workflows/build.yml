name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          find luci-app-netifyd/root/etc/init.d luci-app-netifyd/root/usr/libexec -type f -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC3043

      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty

      - name: Validate JS syntax
        run: find luci-app-netifyd/htdocs -name '*.js' -print0 | xargs -0 -n1 node --check

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk_arch: x86-64-openwrt-25.12
          - arch: arm
            sdk_arch: arm_cortex-a7-openwrt-25.12
          - arch: arm64
            sdk_arch: aarch64_generic-openwrt-25.12
          - arch: mips
            sdk_arch: mips_24kc-openwrt-25.12
          - arch: mips64
            sdk_arch: mips64_mips64r2-openwrt-25.12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_arch }}
          PACKAGES: luci-app-netifyd

      - name: List build output (debug aid)
        if: always()
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          echo "--- top-level workspace listing ---"
          ls -la .
          echo "--- any .apk under the workspace ---"
          find . -name '*.apk' 2>&1
          echo "--- done ---"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-netifyd-apk-${{ matrix.arch }}
          path: bin/**/luci-app-netifyd*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # luci-app-netifyd is architecture-independent (LUCI_PKGARCH:=all, pure
      # shell/JS, nothing compiled), so every matrix arch produces the same
      # package content. The matrix above exists to catch feed/build
      # incompatibilities on each architecture; only the x86_64 build's
      # output is actually attached to the release to avoid publishing
      # several identical .apk files under different names.
      - name: Download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-netifyd-apk-x86_64
          path: dist

      - name: Attach apk to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
